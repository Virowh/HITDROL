name: Windows release

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip only if these exact application sources already passed tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare Rust and neutral build paths
        run: |
          rustup default stable
          if ($LASTEXITCODE) { throw 'Rust toolchain unavailable' }
          rustc --version
          cargo --version
          $flags = "-C target-feature=+crt-static --remap-path-prefix=$env:GITHUB_WORKSPACE=/hitdrol --remap-path-prefix=$env:USERPROFILE=/build-user"
          "RUSTFLAGS=$flags" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test application
        if: ${{ !inputs.skip_tests }}
        run: |
          cargo test --all-targets --locked
          if ($LASTEXITCODE) { throw 'Application tests failed' }

      - name: Check application and installer actions
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE) { throw 'Application Clippy failed' }
          cargo clippy --manifest-path installer-actions/Cargo.toml --all-targets --locked -- -D warnings
          if ($LASTEXITCODE) { throw 'Installer Clippy failed' }

      - name: Build portable ZIP and MSI
        run: |
          ./scripts/package.ps1 -SkipChecks
          ./scripts/build-installer.ps1 -SkipPackage

      - name: Verify installer without installing
        run: |
          ./scripts/verify-installer-options.ps1
          ./scripts/verify-installer-preview.ps1

      - name: Verify packages and executable privacy
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (Get-Content VERSION -Raw).Trim().Replace(' ', '-')
          foreach ($extension in @('zip', 'msi')) {
            $name = "HITDROL-$release-windows-x64.$extension"
            $expected = ((Get-Content "dist/$name.sha256" -Raw).Trim() -split '\s+')[0]
            $actual = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Checksum mismatch: $name" }
          }
          $exe = 'target/release/hitdrol-launcher.exe'
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if ($text.Contains($env:USERPROFILE, [StringComparison]::OrdinalIgnoreCase) -or $text.Contains($env:GITHUB_WORKSPACE, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Executable exposes a machine-specific build path'
          }
          "Executable SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant())"
          git diff --exit-code -- Cargo.lock installer-actions/Cargo.lock
          if ($LASTEXITCODE) { throw 'Locked dependencies changed' }

      - name: Upload release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hitdrol-windows-x64
          path: |
            dist/HITDROL-*-windows-x64.zip
            dist/HITDROL-*-windows-x64.zip.sha256
            dist/HITDROL-*-windows-x64.msi
            dist/HITDROL-*-windows-x64.msi.sha256
          if-no-files-found: error
          retention-days: 14

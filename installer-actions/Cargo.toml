[package]
name = "hitdrol-installer-actions"
version = "0.4.8"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
panic = "abort"
strip = true
lto = true

[dependencies]
anyhow = "1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Threading", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_System_Memory"] }
